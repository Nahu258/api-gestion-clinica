# ==============================================================================
# EmergenciaYA — Entorno de Infraestructura y Aplicación Completo
# Levantar todo:      docker compose up -d --build
# Ver estado:         docker compose ps
# Apagar:             docker compose down
#
# Frontend:            http://localhost:5173
# API:                 http://localhost:8000/api/v1
# Panel de RabbitMQ:   http://localhost:15672  (guest / guest)
# Prometheus:          http://localhost:9090   (métricas y alertas)
# Grafana:             http://localhost:3000   (dashboard "EmergenciaYA", sin login)
# ==============================================================================

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: clinica
      POSTGRES_USER: clinica
      POSTGRES_PASSWORD: clinica
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinica -d clinica"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"     # conexion AMQP
      - "15672:15672"   # panel web administrativo
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  api:
    build: .
    environment:
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,api"
      DATABASE_ENGINE: postgres
      POSTGRES_HOST: postgres
      POSTGRES_DB: clinica
      POSTGRES_USER: clinica
      POSTGRES_PASSWORD: clinica
      REDIS_URL: redis://redis:6379/1
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F?connection_attempts=3&retry_delay=2
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      NOMBRE_SERVICIO: api
    ports:
      - "8000:8000"
    # AE4: la API se declara sana cuando /salud responde (base, Redis y RabbitMQ).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/salud', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/app
      - media:/app/media
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_turnos &&
             python manage.py seed_demo &&
             python manage.py runserver 0.0.0.0:8000"

  # Consumidor de RabbitMQ para comprobantes PDF con QR (TurnoReservado)
  worker:
    build: .
    environment:
      DATABASE_ENGINE: postgres
      POSTGRES_HOST: postgres
      POSTGRES_DB: clinica
      POSTGRES_USER: clinica
      POSTGRES_PASSWORD: clinica
      REDIS_URL: redis://redis:6379/1
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F?connection_attempts=3&retry_delay=2
      NOMBRE_SERVICIO: worker
      METRICS_PORT: "8002"
    volumes:
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: python manage.py consumir_turnos
    restart: unless-stopped

  # Consumidor de RabbitMQ para eventos de Clinica (TurnoAtendido, etc.)
  consumidor:
    build: .
    environment:
      DATABASE_ENGINE: postgres
      POSTGRES_HOST: postgres
      POSTGRES_DB: clinica
      POSTGRES_USER: clinica
      POSTGRES_PASSWORD: clinica
      REDIS_URL: redis://redis:6379/1
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F?connection_attempts=3&retry_delay=2
      NOMBRE_SERVICIO: consumidor
      METRICS_PORT: "8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: python manage.py consume_rabbitmq
    restart: unless-stopped

  # Frontend web (React/Vite) — EmergenciaYA
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: http://api:8000
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      # Docker Desktop en Windows no propaga eventos de archivos al contenedor
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
    # Código montado en vivo: los cambios se ven sin reconstruir la imagen.
    # node_modules queda en un volumen propio del contenedor (el del host tiene
    # binarios de Windows). Si cambian las dependencias:
    #   docker compose up -d --build -V frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    restart: unless-stopped

  # ── AE4: observabilidad ────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observabilidad/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observabilidad/alertas.yml:/etc/prometheus/alertas.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      retries: 6

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      # Solo para la demo local: acceso anónimo de lectura, sin login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/emergenciaya.json
    volumes:
      - ./observabilidad/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observabilidad/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  media:

