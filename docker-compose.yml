# ==============================================================================
# AE2 — Entorno de Infraestructura Completo
# Levantar todo:      docker compose up -d --build
# Ver estado:         docker compose ps
# Apagar:             docker compose down
#
# API:                 http://localhost:8000/api/v1
# Panel de RabbitMQ:   http://localhost:15672  (guest / guest)
# ==============================================================================

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: clinica
      POSTGRES_USER: clinica
      POSTGRES_PASSWORD: clinica
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinica -d clinica"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"     # conexion AMQP
      - "15672:15672"   # panel web administrativo
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  api:
    build: .
    environment:
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,api"
      DATABASE_ENGINE: postgres
      POSTGRES_HOST: postgres
      POSTGRES_DB: clinica
      POSTGRES_USER: clinica
      POSTGRES_PASSWORD: clinica
      REDIS_URL: redis://redis:6379/1
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F?connection_attempts=3&retry_delay=2
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - media:/app/media
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_turnos &&
             python manage.py runserver 0.0.0.0:8000"

  # Consumidor de RabbitMQ para comprobantes PDF con QR (TurnoReservado)
  worker:
    build: .
    environment:
      DATABASE_ENGINE: postgres
      POSTGRES_HOST: postgres
      POSTGRES_DB: clinica
      POSTGRES_USER: clinica
      POSTGRES_PASSWORD: clinica
      REDIS_URL: redis://redis:6379/1
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F?connection_attempts=3&retry_delay=2
    volumes:
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: python manage.py consumir_turnos
    restart: unless-stopped

  # Consumidor de RabbitMQ para eventos de Clinica (TurnoAtendido, etc.)
  consumidor:
    build: .
    environment:
      DATABASE_ENGINE: postgres
      POSTGRES_HOST: postgres
      POSTGRES_DB: clinica
      POSTGRES_USER: clinica
      POSTGRES_PASSWORD: clinica
      REDIS_URL: redis://redis:6379/1
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F?connection_attempts=3&retry_delay=2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: python manage.py consume_rabbitmq
    restart: unless-stopped

volumes:
  pgdata:
  media:
