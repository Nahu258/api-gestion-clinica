# AE4 - Prometheus: recolecta las métricas de la API y de los consumidores.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: consumidor
    static_configs:
      - targets: ["consumidor:8001"]
  - job_name: worker
    static_configs:
      - targets: ["worker:8002"]
